<div class="flex min-h-full flex-col gap-10 bg-[#f7f9fb] p-3 px-5 pb-20">
  <h1>{{ 'test-section.title' | translate }}</h1>

  <form
    class="flex flex-col items-center justify-center gap-5 rounded-md bg-blue-100 p-3"
    [formGroup]="formProva"
  >
    <div class="grid grid-cols-3 justify-center gap-5">
      <div>
        <label for="name">{{
          'SHARED.form.name.placeholder' | translate
        }}</label>
        <input
          class="rounded-md border-2 border-amber-950 p-2"
          id="name"
          type="text"
          formControlName="name"
          [placeholder]="'SHARED.form.name.placeholder' | translate"
        />
      </div>
      <div>
        <label for="surname">
          {{ 'SHARED.form.surname.placeholder' | translate }}
        </label>
        <input
          id="surname"
          class="rounded-md border-2 border-amber-950 p-2"
          type="text"
          formControlName="surname"
          [placeholder]="'SHARED.form.surname.placeholder' | translate"
        />
      </div>
      <div>
        <label for="surname">
          {{ 'SHARED.form.surname.placeholder' | translate }}
        </label>
        <input
          id="surname"
          class="rounded-md border-2 border-amber-950 p-2"
          type="text"
          formControlName="surname"
          [placeholder]="'SHARED.form.surname.placeholder' | translate"
        />
      </div>
    </div>
    <div class="flex gap-5">
      <button
        type="reset"
        class="rounded-md bg-red-500 p-2"
        (click)="onReset()"
      >
        {{ 'SHARED.button.cancel' | translate }}
      </button>
      <button
        type="submit"
        class="rounded-md bg-blue-500 p-2"
        [disabled]="formProva.invalid"
      >
        {{ 'SHARED.button.search' | translate }}
      </button>
    </div>
  </form>
</div>
