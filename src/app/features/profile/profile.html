<div class="min-h-full bg-[#f7f9fb] p-3 px-5 pb-20">
  <app-hero />
  <div class="flex flex-col gap-3">
    @if (coreStore.profiloLoading()) {
      <div
        class="absolute inset-0 z-50 flex items-center justify-center bg-white/70"
      >
        <app-loader />
      </div>
    } @else {
      <app-user-card [user]="coreStore.userInfo()" />
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        @for (card of profileCardsConfig(); track card.title) {
          <app-card-profile
            [user]="coreStore.userInfo()"
            [title]="card.title"
            [icon]="card.icon"
            [cardField]="card.fields"
          />
        }
      </div>
    }
  </div>
</div>
