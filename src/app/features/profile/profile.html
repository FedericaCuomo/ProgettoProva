  <app-hero />
  <div class="flex flex-col gap-3">
    <app-user-card [user]="user()" />
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      @for (card of profileCardsConfig(); track card.title) {

          [title]="card.title"
          [icon]="card.icon"
          [cardField]="card.fields"
          [user]="user()"
        />

      }
