<div class="bg-white rounded-lg p-5 h-full">
  <div class=" flex justify-between">
    <div class="flex items-center gap-2">
      <div class="{{ icon }} text-[#2563eb]"></div>
      <div>{{ title }}</div>
    </div>
    <div class="text-[#2563eb]" (click)="onEdit()">Modifica</div>
  </div>
  <hr />

  <div class="flex flex-col gap-2">
    @for (field of cardField; track $index) {
      <div class="flex justify-between">
        <div class="text-gray-500">{{ field.label }}</div>
        <div class="text-right">{{ field.value }}</div>
      </div>
    }
  </div>
</div>
@if (isEditing == true) {
  <form
    class="fixed inset-0 bg-[#00173d] w-fit h-fit top-10 p-5 flex items-center justify-center flex-col rounded-lg text-white"
    (ngSubmit)="onEdit()"
  >
    <h3>Modifica dati anagrafici</h3>
    <div class="flex flex-col gap-3">
      <ngx-sirio-input name="name" label="Nome completo" formControlName="fullname" />
      <ngx-sirio-input name="date" label="Data di nascita" formControlName="date" />
      <ngx-sirio-input name="city" label="Città" formControlName="city" />
      <ngx-sirio-input name="address" label="Indirizzo di residenza" formControlName="address" />
      <ngx-sirio-input name="status" label="Stato civile" formControlName="status" />
      <div class="flex gap-3">
        <ngx-sirio-button type="submit" color="primary"> Modifica </ngx-sirio-button>
        <ngx-sirio-button type="button" color="danger"> Annulla </ngx-sirio-button>
      </div>
    </div>
  </form>
}
