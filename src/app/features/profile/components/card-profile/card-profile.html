<div class="h-full rounded-lg bg-white p-5">
  <div class="flex justify-between">
    <div class="flex items-center gap-2">
      <div class="text-[#2563eb]" [ngClass]="icon"></div>
      <div>{{ title }}</div>
    </div>
    <button type="button" class="text-[#2563eb]" (click)="onEdit()">
      Modifica
    </button>
  </div>
  <hr />

  <div class="flex flex-col gap-2">
    @if (user(); as userData) {
      <!-- primo giro del ciclo for field=fullname e userData[field.key] cerca dentro l'utente il valore associato a quella chiave -->
      @for (field of cardField; track $index) {
        <div class="flex justify-between">
          <div class="text-gray-500">{{ field.label }}</div>
          <div class="text-right">{{ userData[field.key] }}</div>
        </div>
      }
    }
  </div>
</div>
