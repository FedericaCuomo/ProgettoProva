<div
  class="flex w-full flex-wrap items-center justify-center gap-3 rounded-lg bg-white p-3 sm:justify-start"
>
  <img
    class="aspect-square h-20 w-20 rounded-full border-2 border-black object-cover"
    src="https://images.pexels.com/photos/2379004/pexels-photo-2379004.jpeg?cs=srgb"
    alt="immagine profilo Mario Rossi"
  />
  <div>
    @if (user(); as userData) {
      <h2>{{ userData.fullname }}</h2>
      <div class="flex flex-col gap-3 sm:flex-row">
        <div class="flex flex-wrap items-center gap-2">
          <div class="fa-solid fa-id-card"></div>
          <div>CF:</div>
          <span>{{ userData.CF }}</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="fa-solid fa-location-dot"></div>
          <div>{{ userData.city }}</div>
        </div>
      </div>
    }
  </div>
</div>
