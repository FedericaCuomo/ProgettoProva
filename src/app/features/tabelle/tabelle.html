<div class="flex justify-center">
  <div class="bg-blue-50 p-5">
    <form
      class="flex flex-col gap-5"
      [formGroup]="searchForm"
      (ngSubmit)="onSearch()"
    >
      <ngx-sirio-input
        label="Nome"
        placeholder="Inserisci nome"
        name="name"
        ariaLabel="input"
        formControlName="name"
        maxLength="10"
      />
      <ngx-sirio-input
        label="Cognome"
        placeholder="Inserisci cognome"
        name="surname"
        ariaLabel="input"
        formControlName="surname"
        maxLength="10"
      />
      <!-- clickEvent con le tonde perchè Output -->
      <div class="flex gap-5">
        <ngx-sirio-button type="submit" color="primary">{{
          'button.search' | translate
        }}</ngx-sirio-button>
        <ngx-sirio-button
          type="button"
          color="primary"
          (clickEvent)="onReset()"
          >{{ 'button.cancel' | translate }}</ngx-sirio-button
        >
      </div>
    </form>
  </div>
</div>
