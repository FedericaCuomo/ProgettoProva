<div class="flex flex-col gap-3">
  @for (service of filteredServices; track $index) {
    <ngx-sirio-card>
      <div class="flex flex-col sm:flex-row justify-between items-center p-5 gap-2">
        <div class="flex flex-col sm:flex-row items-center gap-2">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
            <div class="{{ service.icon }} text-blue-600"></div>
          </div>
          <div class="flex-col text-center">
            <h3>
              {{ service.name }}
            </h3>

            <div>
              {{ service.text }}
            </div>
          </div>
        </div>
        <div
          class="rounded-[5px] px-2 py-1 {{ colorBox(service.category) }} {{
            colorIcon(service.category)
          }}"
        >
          {{ service.category }}
        </div>
      </div>
    </ngx-sirio-card>
  }
</div>
