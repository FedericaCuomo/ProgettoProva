<div class="flex flex-col gap-5">
  @for (service of filteredServices; track $index) {
    <ngx-sirio-card>
      <div
        class="flex flex-col items-center justify-between gap-2 p-5 sm:flex-row"
      >
        <div class="flex flex-col items-center gap-5 sm:flex-row">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-100"
          >
            <div class="text-blue-600" [ngClass]="service.icon"></div>
          </div>
          <div class="flex-col text-center sm:text-left">
            <h3>
              {{ service.name }}
            </h3>

            <div>
              {{ service.text }}
            </div>
          </div>
        </div>
        <div
          class="rounded-[5px] px-2 py-1"
          [ngClass]="[colorBox(service.category), colorIcon(service.category)]"
        >
          {{ service.category }}
        </div>
      </div>
    </ngx-sirio-card>
  }
</div>
