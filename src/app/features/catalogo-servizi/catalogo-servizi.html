<div class="flex min-h-full flex-col gap-3 bg-[#f7f9fb] p-2 px-5 pb-20">
  <div class="flex items-center justify-between">
    <app-hero />
    <ngx-sirio-button color="primary" (clickEvent)="openAddDialog()">
      <span class="hidden sm:block">Aggiungi servizio</span>
      <span class="block sm:hidden">+</span>
    </ngx-sirio-button>
  </div>
  <app-filter
    class="flex gap-2 py-2"
    (categorySelected)="onCategoryChange($event)"
  />
  <app-search />
  <app-lista-servizi [selectedCategory]="selectedCategory" />
</div>
