<div class="flex h-full flex-col gap-3 bg-[#f7f9fb] p-2 px-5">
  <div class="flex items-center justify-between">
    <app-hero />
    <ngx-sirio-button color="primary" (click)="isOpen = !isOpen">
      <span class="hidden sm:block">Aggiungi servizio</span>
      <span class="block sm:hidden">+</span>
    </ngx-sirio-button>
  </div>
  <app-filter
    class="flex gap-2 py-2"
    (categorySelected)="onCategoryChange($event)"
  />
  <app-search />
  <app-lista-servizi [selectedCategory]="selectedCategory" />

  @if (isOpen === true) {
    <app-new-service-form
      (cancelClick)="isOpen = false"
      (nuovoServizio)="onServizioAggiunto($event)"
    />
  }
</div>
