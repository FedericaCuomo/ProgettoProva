<div class="p-3">
  <div class="hidden self-start sm:block">
    <div class="flex flex-col">
      @for (voice of menu; track voice.id) {
        <div
          routerLinkActive="bg-blue-100 border-l-blue-500 active"
          class="group flex h-10 cursor-pointer items-center gap-3 border-4 border-transparent p-2 text-gray-500 hover:border-l-blue-500 hover:bg-blue-100"
          [routerLink]="voice.name"
        >
          <span
            class="text-gray-500 select-none group-hover:text-blue-600 group-[.active]:text-blue-600!"
            [ngClass]="voice.icon"
          ></span>

          <a
            class="text-gray-500 capitalize no-underline select-none group-hover:text-blue-600! group-[.active]:text-blue-600!"
          >
            {{ voice.name }}
          </a>
        </div>
      }
    </div>
  </div>

  <div class="relative block sm:hidden">
    <ngx-sirio-button
      class="relative"
      color="primary"
      icon="fas fa-bars"
      (click)="openMenu = !openMenu"
    />
    @if (openMenu === true) {
      <div class="absolute z-50 flex flex-col gap-3 rounded-lg bg-white p-3">
        @for (voice of menu; track voice.id) {
          <a
            class="text-[20px] capitalize"
            [routerLink]="voice.name"
            (click)="openMenu = false"
          >
            <span class="hover:text-blue-500"> {{ voice.name }} </span>
          </a>
        }
      </div>
    }
  </div>
</div>
