<div class="flex justify-between bg-[#00173d] px-5 py-3 text-white">
  <div class="flex items-center gap-2 select-none" routerLink="home">
    <div class="fa-solid fa-house"></div>
    <div>Portale</div>
  </div>

  <div class="flex items-center gap-4 select-none">
    <div class="fa-solid fa-bell"></div>
    <div class="fa-solid fa-circle-user"></div>
    <div routerLink="profilo">Mario Rossi</div>
    <ngx-sirio-select
      [placeholder]="'SHARED.select.language.english' | translate"
    >
      <ngx-sirio-select-panel
        ariaLabel="Elementi select"
        (optionSelected)="onSelectedLanguage($event)"
      >
        <ngx-sirio-select-option value="it">{{
          'SHARED.select.language.italian' | translate
        }}</ngx-sirio-select-option>
        <ngx-sirio-select-option value="en">
          {{ 'SHARED.select.language.english' | translate }}
        </ngx-sirio-select-option>
      </ngx-sirio-select-panel>
    </ngx-sirio-select>
  </div>
</div>
